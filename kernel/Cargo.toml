[package]
name = "novation-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "novation_kernel"
crate-type = ["lib", "cdylib"]

[dependencies]
stylus-sdk = "=0.10.9"
alloy-primitives = { version = "=1.7.3", default-features = false }
alloy-sol-types = { version = "=1.7.3", default-features = false }

[dev-dependencies]
# host tests link the SDK's panicking hostio stubs instead of the wasm imports
stylus-sdk = { version = "=0.10.9", features = ["stylus-test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
export-abi = ["stylus-sdk/export-abi"]
contract-client-gen = []

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
strip = true
debug = false
